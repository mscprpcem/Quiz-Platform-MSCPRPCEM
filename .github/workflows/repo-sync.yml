name: Sync Main to Public Open Source Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-public:
    name: Sync main to Quiz-Platform-MSCPRPCEM (One-way Mirror)
    if: github.repository == 'mscprpcem/Quiz-platform'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Public Open Source Repository
        env:
          TARGET_REPO_URL: "github.com/mscprpcem/Quiz-Platform-MSCPRPCEM.git"
          SYNC_TOKEN: ${{ secrets.SYNC_PAT || secrets.PUBLIC_REPO_PAT }}
        run: |
          # Verify token availability for cross-repository sync
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice title=SYNC_PAT Not Configured::Automatic sync to public repo is paused because SYNC_PAT secret is not configured. To enable sync, add a GitHub PAT with 'repo' scope as repository secret 'SYNC_PAT'."
            echo "Skipping cross-repository sync cleanly."
            exit 0
          fi

          echo "Starting automatic synchronization to public open-source repository..."
          
          # Configure Git credentials
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a dedicated sync branch for public open-source distribution
          echo "Preparing clean open-source release branch..."
          git checkout -b public-sync-release

          # Remove CI/CD deployment and internal workflows so the open-source repo has no build & deploy actions
          if [ -d ".github/workflows" ]; then
            echo "Removing .github/workflows from open-source distribution..."
            rm -rf .github/workflows
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(opensource): mirror main without production build and deployment workflows"
            fi
          fi

          # Add target remote with authentication token
          git remote add public-target "https://x-access-token:${SYNC_TOKEN}@${TARGET_REPO_URL}"
          
          # Force push to mirror the cleaned branch to public repository
          echo "Syncing cleaned main branch to https://${TARGET_REPO_URL}..."
          git push public-target public-sync-release:main --force
          
          echo "Repository synchronization completed successfully! Public repo now contains clean open-source code without build/deploy workflows."
